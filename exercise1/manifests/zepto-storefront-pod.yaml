apiVersion: v1
kind: Pod
metadata:
  name: zepto-storefront
  labels:
    app: zepto-storefront
    tier: frontend
spec:
  containers:
  - name: web-server
    image: nginx:latest
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 80
      name: http
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "250m"
    volumeMounts:
    - name: html-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: html-volume
    configMap:
      name: zepto-storefront-html
