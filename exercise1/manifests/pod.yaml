apiVersion: v1
kind: Pod
metadata:
  name: hello-k8s
  labels:
    app: zepto-storefront
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx:latest
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 80
      name: http
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "250m"
